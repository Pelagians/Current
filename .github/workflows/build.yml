name: current-builder

on:
  schedule:
    - cron: "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-runtime-artifacts:
    name: Validate runtime artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check runtime scripts, templates, and units
        run: |
          set -euo pipefail
          bash ./scripts/validate-runtime-artifacts.sh
          bash ./scripts/test-cosmic-pam.sh

  validate-image-matrix:
    name: Validate image matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check supported and unsupported recipe combinations
        run: |
          set -euo pipefail
          bash ./scripts/validate-image-matrix.sh

  validate-alma9-nvidia-580:
    name: Validate Alma 9 NVIDIA 580
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Alma 9 NVIDIA 580 lane
        shell: pwsh
        run: ./scripts/verify-alma9-nvidia-580.ps1

  x64-images:
    name: X64 images
    needs:
      - validate-runtime-artifacts
      - validate-image-matrix
      - validate-alma9-nvidia-580
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-architecture.yml
    with:
      architecture: x86_64
      runner: ubuntu-latest
    secrets: inherit

  arm64-images:
    name: ARM64 images
    needs:
      - validate-runtime-artifacts
      - validate-image-matrix
      - validate-alma9-nvidia-580
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-architecture.yml
    with:
      architecture: aarch64
      runner: ubuntu-24.04-arm
    secrets: inherit

  publish-indexes:
    name: Publish verified multi-architecture indexes
    needs: [x64-images, arm64-images]
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CURRENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CURRENT_PR_NUMBER: ${{ github.event.number }}
      COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-digests
          merge-multiple: true
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/setup-buildx-action@v3
      - name: Install registry inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Authenticate publishing tools
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Validate, sign and publish complete indexes
        run: python3 scripts/publish-image-index.py publish
