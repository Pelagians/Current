name: current-builder

on:
  schedule:
    - cron: "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-runtime-artifacts:
    name: Validate runtime artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check runtime scripts, templates, and units
        run: |
          set -euo pipefail
          bash ./scripts/validate-runtime-artifacts.sh

  validate-image-matrix:
    name: Validate image matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check supported and unsupported recipe combinations
        run: |
          set -euo pipefail
          bash ./scripts/validate-image-matrix.sh

  validate-alma9-nvidia-580:
    name: Validate Alma 9 NVIDIA 580
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Alma 9 NVIDIA 580 lane
        shell: pwsh
        run: ./scripts/verify-alma9-nvidia-580.ps1

  x64-images:
    name: X64 images
    needs:
      - validate-runtime-artifacts
      - validate-image-matrix
      - validate-alma9-nvidia-580
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-architecture.yml
    with:
      architecture: x86_64
      runner: ubuntu-latest
    secrets: inherit

  arm64-images:
    name: ARM64 images
    needs:
      - validate-runtime-artifacts
      - validate-image-matrix
      - validate-alma9-nvidia-580
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-architecture.yml
    with:
      architecture: aarch64
      runner: ubuntu-24.04-arm
    secrets: inherit
