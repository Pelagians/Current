modules:
  # x86_64 ROCm userspace; included only by x64 recipes.
  # Alma 10 keeps the vendor ROCm repo because Fedora carries its own native
  # packages and Alma 9 no longer needs the ROCm baseline.
  - type: dnf
    repos:
      files:
        - rocm.repo
      keys:
        - https://repo.radeon.com/rocm/rocm.gpg.key
    install:
      install-weak-deps: false
      skip-broken: true
      packages:
        - clinfo
        - repo: rocm
          packages:
            - amd-smi-lib
            - rocminfo
            - rocm-hip-sdk
            - rocm-ml-sdk
            - rocm-opencl-sdk
            - rocm-smi-lib

