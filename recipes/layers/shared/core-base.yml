modules:
  # Cross-distro core baseline shared by every supported Current image.
  - type: os-release-meta
    source: local

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - lshw
        - dnf-plugins-core
        - audit
        - rpm-plugin-audit
        - basesystem
        - bash
        - coreutils
        - crypto-policies
        - crypto-policies-scripts
        - e2fsprogs
        - filesystem
        - glibc
        # Retain the installer's English locale across every destination role.
        - glibc-langpack-en
        - ca-certificates
        - hostname
        - irqbalance
        - kbd
        - less
        - ncurses
        - policycoreutils
        - procps-ng
        - rootfiles
        - rpm
        - selinux-policy-targeted
        - setup
        - shadow-utils
        - sudo
        - systemd
        - systemd-udev
        - util-linux
        - xfsprogs
        - curl
        - iproute
        - iputils
        - NetworkManager
        - NetworkManager-tui
        - openssh-server
        - openssh-clients
        - p11-kit
        - chrony
        - dosfstools
        - sg3_utils
        - sg3_utils-libs
        - dbus
        - python3-libselinux
        - linux-firmware
        - system-reinstall-bootc
        - podman
        - podman-docker
        - container-selinux
        - conntrack-tools
        - skopeo
        - buildah
        - fuse-overlayfs
        - mesa-vulkan-drivers
        - slirp4netns
        - policycoreutils-python-utils
        - vim-minimal
        - vulkan-loader
        - vulkan-tools
        - bzip2
        - file
        - gnupg2
        - mailcap
        - rsync
        - tar
        - unzip
        - wget
        - which
        - zip
        - iptables
        - iptables-nft
        - nftables
        - iproute-tc
        - socat
        - ebtables
        - ethtool

  - type: files
    files:
      - source: base/runtime
        destination: /
      - source: justfiles
        destination: /
      - source: base/branding
        destination: /

  - from-file: layers/shared/setup.yml

  - from-file: layers/features/k3s.yml
  - from-file: layers/features/pcp.yml
  - from-file: layers/features/tailscale.yml
  - from-file: layers/shared/system-policy.yml

  - type: containerfile
    snippets:
      - >-
        RUN export ORIGINAL_NAME=$(grep -oP '^NAME="\K[^"]*' /etc/os-release) &&
        export VERSION_ID=$(grep -oP '^VERSION_ID="?\K[^"\n]*' /etc/os-release) &&
        export ORIGINAL_PRETTY=$(grep -oP '^PRETTY_NAME="\K[^"]*' /etc/os-release) &&
        sed -i "s/^NAME=.*/NAME=\"Current ${ORIGINAL_NAME} ${VERSION_ID}\"/" /etc/os-release &&
        sed -i "s/^PRETTY_NAME=.*/PRETTY_NAME=\"Current ${ORIGINAL_PRETTY}\"/" /etc/os-release &&
        sed -i "s/^VENDOR_NAME=.*/VENDOR_NAME=\"Pelagian Current\"/" /etc/os-release &&
        sed -i "s/^NAME=.*/NAME=\"Current ${ORIGINAL_NAME} ${VERSION_ID}\"/" /usr/lib/os-release &&
        sed -i "s/^PRETTY_NAME=.*/PRETTY_NAME=\"Current ${ORIGINAL_PRETTY}\"/" /usr/lib/os-release &&
        sed -i "s/^VENDOR_NAME=.*/VENDOR_NAME=\"Pelagian Current\"/" /usr/lib/os-release &&
        echo "UPSTREAM_OS=\"${ORIGINAL_PRETTY}\"" >> /etc/os-release
