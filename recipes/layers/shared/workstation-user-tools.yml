modules:
  - type: brew
    nofile-limits: true
    brew-analytics: false

  - type: files
    files:
      - source: workstation/user-tools
        destination: /

  - type: containerfile
    snippets:
      - RUN curl -fsSL https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo -o /etc/yum.repos.d/brave-browser.repo
      - RUN dnf install -y brave-origin
      - RUN dnf clean all && rm -rf /var/cache/dnf /var/tmp/* /tmp/*
