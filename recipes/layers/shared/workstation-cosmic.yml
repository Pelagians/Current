---
modules:
  # Shared COSMIC workstation layer. Distro-specific COSMIC layers select the
  # package source before this layer runs; this layer owns the common COSMIC
  # session stack, COSMIC payloads, and validation.
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - cosmic-session
        - cosmic-comp
        - cosmic-panel
        - cosmic-app-library
        - cosmic-applets
        - cosmic-edit
        - cosmic-files
        - cosmic-idle
        - cosmic-launcher
        - cosmic-monitor
        - cosmic-notifications
        - cosmic-osd
        - cosmic-player
        - cosmic-settings
        - cosmic-settings-daemon
        - cosmic-store
        - cosmic-term
        - cosmic-workspaces
        - cosmic-randr
        - cosmic-screenshot
        - cosmic-bg
        - cosmic-wallpapers
        - cosmic-icon-theme
        - cosmic-initial-setup
        - cosmic-greeter
        - greetd
        - adw-gtk3-theme
        - cosmic-config-fedora
        - cosmic-ext-applet-tailscale
        - cosmic-ext-applet-clipboard-manager
        - cosmic-ext-applet-system-monitor
        - cosmic-ext-applet-ollama
        - cosmic-ext-applet-emoji-selector
        - cosmic-ext-applet-sysinfo
        - cosmic-ext-applet-minimon
        - cosmic-ext-applet-classic-menu
        - cosmic-ext-tweaks
        - cosmic-ext-storage
        - cosmic-ext-examine
        - cosmic-ext-applet-places-menu
        - gvfs-nfs
        - pipewire-v4l2
        - inputplumber

  - type: systemd
    system:
      enabled:
        - cosmic-ext-storage-daemon.service

  - type: files
    files:
      - source: cosmic/shared
        destination: /

  - from-file: layers/shared/flatpak-cosmic.yml

  - type: containerfile
    snippets:
      - >-
        RUN set -eux; \
          command -v cosmic-session >/dev/null; \
          command -v cosmic-panel >/dev/null; \
          command -v cosmic-app-library >/dev/null; \
          command -v cosmic-files >/dev/null; \
          command -v cosmic-settings >/dev/null; \
          command -v cosmic-store >/dev/null; \
          command -v cosmic-ext-storage >/dev/null; \
          test -f /usr/share/applications/com.cosmic.ext.Storage.desktop; \
          rpm -q cosmic-edit cosmic-idle cosmic-monitor cosmic-player; \
          command -v cosmic-greeter-start >/dev/null; \
          command -v cosmic-greeter-daemon >/dev/null; \
          command -v gnome-keyring-daemon >/dev/null; \
          find /usr/share/wayland-sessions -maxdepth 1 -type f -iname '*cosmic*.desktop' | grep -q .; \
          find /usr/lib /usr/lib64 -path '*/security/pam_gnome_keyring.so' -type f | grep -q .; \
          /usr/libexec/current-workstation-dm-apply --check cosmic
