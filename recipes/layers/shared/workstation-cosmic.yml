---
modules:
  # Shared COSMIC workstation layer. Distro-specific COSMIC layers select the
  # package source before this layer runs; this layer owns the common COSMIC
  # session stack, COSMIC payloads, and validation.
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - iso-codes
        - cosmic-session
        - cosmic-comp
        - cosmic-panel
        - cosmic-app-library
        - cosmic-applets
        - cosmic-edit
        - cosmic-files
        - cosmic-idle
        - cosmic-launcher
        - cosmic-monitor
        - cosmic-notifications
        - cosmic-osd
        - cosmic-player
        - cosmic-settings
        - cosmic-settings-daemon
        - cosmic-store
        - cosmic-term
        - cosmic-workspaces
        - cosmic-randr
        - cosmic-screenshot
        - cosmic-bg
        - cosmic-wallpapers
        - cosmic-icon-theme
        - cosmic-initial-setup
        - cosmic-greeter
        - greetd
        - adw-gtk3-theme

  - type: files
    files:
      - source: cosmic/shared
        destination: /

  # Data-only bundle: checked native RPMs, no build tools or source archives in
  # the installed image. ARM retains its native packages until separately tested.
  - type: containerfile
    snippets:
      - >-
        RUN --mount=type=bind,from=stage-files,src=/files,dst=/tmp/files,ro
        --mount=type=bind,from=ghcr.io/pelagians/current-cosmic-repairs@sha256:9ced98656d1d47057161ca089f2665337df3daa6596d4d85113f77c4d7dff2fe,src=/,dst=/tmp/current-cosmic-repairs,ro
        python3 /tmp/files/scripts/install-cosmic-repairs.py /tmp/current-cosmic-repairs

  - from-file: layers/shared/flatpak-cosmic.yml

  - type: script
    scripts:
      - cosmic-locale-compat.sh

  - type: containerfile
    snippets:
      - >-
        RUN set -eux; \
          command -v cosmic-session >/dev/null; \
          command -v cosmic-panel >/dev/null; \
          command -v cosmic-app-library >/dev/null; \
          command -v cosmic-files >/dev/null; \
          command -v cosmic-settings >/dev/null; \
          command -v cosmic-store >/dev/null; \
          rpm -q cosmic-edit cosmic-idle cosmic-monitor cosmic-player; \
          command -v cosmic-greeter-start >/dev/null; \
          command -v cosmic-greeter-daemon >/dev/null; \
          command -v gnome-keyring-daemon >/dev/null; \
          find /usr/share/wayland-sessions -maxdepth 1 -type f -iname '*cosmic*.desktop' | grep -q .; \
          find /usr/lib /usr/lib64 -path '*/security/pam_gnome_keyring.so' -type f | grep -q .; \
          /usr/libexec/current-workstation-dm-apply --check cosmic
