        destination: /

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - almalinux-release
        - google-noto-cjk-fonts-common
        - google-noto-fonts-common
        - libva-utils
        - systemd-oomd
        - xorg-x11-utils
