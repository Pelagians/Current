---
modules:
  # Alma/RHEL-family repository setup required before shared/core.yml installs
  # common core tools that come from EPEL/CRB on EL-derived images.
  - type: dnf
    install:
      packages:
        - epel-release

  - type: containerfile
    snippets:
      - RUN dnf -y config-manager --set-enabled crb

  - type: dnf
    remove:
      packages:
        - subscription-manager
    install:
      install-weak-deps: false
      packages:
        - dnf

  - type: dnf
    repos:
      files:
        - opentofu.repo
      keys:
        - https://packages.opentofu.org/opentofu/tofu/gpgkey
        - https://get.opentofu.org/opentofu.asc
    install:
      install-weak-deps: false
      packages:
        - repo: opentofu
          packages:
            - tofu

  - type: containerfile
    snippets:
      - RUN --mount=type=bind,from=stage-files,src=/files,dst=/tmp/files,ro /usr/bin/bash /tmp/files/scripts/install-helm.sh
