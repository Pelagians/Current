---
modules:
  # The ligenix Enterprise COSMIC COPR defaults Alma 10 to epel-10, but the
  # project publishes Alma 10 content as rhel+epel-10. Keep this source setup
  # small and explicit; package installation stays in the BlueBuild dnf module.
  - type: containerfile
    snippets:
      - >-
        RUN set -eux; \
          . /usr/share/current/os-release-meta.env; \
          arch="$(uname -m)"; \
          if [ "${EL_MAJOR}" = "9" ]; then \
            copr_target="epel-9-${arch}"; \
          elif [ "${EL_MAJOR}" = "10" ]; then \
            copr_target="rhel+epel-10-${arch}"; \
          else \
            echo "Unsupported EL major for COSMIC: ${EL_MAJOR}" >&2; exit 1; \
          fi; \
          dnf -y copr enable "ligenix/enterprise-cosmic" "${copr_target}"

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - cosmic-config-fedora
        - cosmic-ext-applet-tailscale
        - cosmic-ext-applet-clipboard-manager
        - cosmic-ext-applet-system-monitor
        - cosmic-ext-applet-ollama
        - cosmic-ext-applet-emoji-selector
        - cosmic-ext-applet-sysinfo
        - cosmic-ext-applet-minimon
        - cosmic-ext-applet-classic-menu
        - cosmic-ext-tweaks
        - cosmic-ext-storage
        - cosmic-ext-examine
        - cosmic-ext-applet-places-menu
        - gvfs-nfs
        - pipewire-v4l2
        - inputplumber
        - openconnect-gui
        - gui-scale-applet
        
  - type: systemd
    system:
      enabled:
        - cosmic-ext-storage-daemon.service
