modules:
  - type: containerfile
    snippets:
      - >-
        RUN set -eux;
        curl -fLsS --retry 5 -o /etc/yum.repos.d/fedora-nvidia.repo
        https://negativo17.org/repos/fedora-nvidia.repo;
        dnf -y --setopt=install_weak_deps=False --enablerepo=fedora-nvidia
        install libnvidia-cfg libnvidia-fbc nvidia-libXNVCtrl nvidia-settings;
        rm -f /etc/yum.repos.d/fedora-nvidia.repo;
        ldconfig
  - type: kargs
    kargs:
      - nvidia-drm.modeset=1
      - nvidia-drm.fbdev=1
