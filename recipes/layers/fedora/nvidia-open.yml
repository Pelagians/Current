modules:
  # Fedora uses NVIDIA's Fedora CUDA repo directly instead of the AlmaLinux
  # NVIDIA release package, but the shared repo bootstrap and kernel args still
  # belong in the common NVIDIA layers.
  - from-file: layers/shared/nvidia-base.yml
  - from-file: layers/shared/nvidia-open-common.yml
  - type: containerfile
    snippets:
      - >-
        RUN if [ "$(uname -m)" = x86_64 ]; then curl -fsSL
        "https://developer.download.nvidia.com/compute/cuda/repos/fedora44/$(uname -m)/cuda-fedora44.repo"
        -o /etc/yum.repos.d/cuda.repo &&
        dnf config-manager setopt cuda-fedora44-x86_64.enabled=0; fi

      - >-
        RUN if [ "$(uname -m)" = x86_64 ]; then dnf -y --setopt=install_weak_deps=False
        --enablerepo=cuda-fedora44-x86_64
        install
        kmod-nvidia-open-dkms
        nvidia-open
        nvidia-driver
        nvidia-driver-cuda
        cuda-toolkit; fi
  - type: containerfile
    snippets:
      - ARG CURRENT_NVIDIA_VARIANT=open
  - from-file: layers/fedora/nvidia-akmod.yml
