modules:
  # Fedora distro delta layered after shared/core.yml.

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - dnf5-plugins
        # The Fedora bootc base includes Avahi even in the server lane.
        - nss-mdns
        - just
        - plocate

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - opentofu
        - helm