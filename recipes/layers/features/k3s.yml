---
modules:
  # Shared k3s runtime capability baked into every lane. Server vs agent mode
  # is a runtime/admin choice made above the image, not a separate image role.
  - type: files
    files:
      - source: k3s/shared
        destination: /

  - type: containerfile
    snippets:
      - RUN --mount=type=bind,from=stage-files,src=/files,dst=/tmp/files,ro /usr/bin/bash /tmp/files/scripts/install-k3s.sh

  - type: systemd
    system:
      disabled:
        - k3s.service
        - k3s-agent.service
