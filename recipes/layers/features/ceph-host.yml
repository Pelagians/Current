---
modules:
  # Shared package location for Ceph/RBD host kernel modules and LVM
  # userspace needed by a Ceph operator on storage-capable server nodes.
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - kernel-modules-core
        - lvm2
        - device-mapper
        - device-mapper-event
        - device-mapper-persistent-data
