# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: alma10-server-nvidia-open
description: Current AlmaLinux 10 stable server image with admin/operator tooling and the NVIDIA open kernel-module lane.
base-image: quay.io/almalinuxorg/almalinux-bootc
image-version: 10
platforms:
  - linux/amd64
  - linux/arm64
modules:
  - from-file: layers/shared/core-base.yml
  - from-file: layers/alma/core.yml
  - from-file: layers/shared/core.yml
  - from-file: layers/alma10/core.yml
  - from-file: layers/alma10/rocm.yml
  - from-file: layers/alma10/ceph-host.yml
  - from-file: layers/shared/nvidia-open.yml
  - type: initramfs
  - type: signing
