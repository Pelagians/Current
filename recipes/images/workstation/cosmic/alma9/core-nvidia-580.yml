# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: alma9-cosmic-nvidia-580
description: Current AlmaLinux 9 COSMIC workstation image for the NVIDIA 580 lane.
base-image: quay.io/almalinuxorg/almalinux-bootc
image-version: latest
platforms:
  - linux/amd64
modules:
  - from-file: layers/shared/core-base.yml
  - from-file: layers/alma/core.yml
  - from-file: layers/shared/core.yml
  - from-file: layers/alma9/core.yml
  - from-file: layers/alma9/nvidia-580.yml
  - from-file: layers/shared/flatpak-base.yml
  - from-file: layers/shared/workstation-common.yml
  - from-file: layers/alma9/workstation.yml
  - from-file: layers/alma/cosmic.yml
  - from-file: layers/shared/workstation-cosmic.yml
  - from-file: layers/shared/nvidia-workstation.yml
  - from-file: layers/alma9/nvidia-workstation.yml
  - type: initramfs
  - type: signing
