---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-server-nvidia-open-arm64
description: NVIDIA open kernel modules; Current ARM64 Fedora edge server image with admin/operator tooling.
base-image: quay.io/fedora/fedora-bootc
image-version: latest
platforms:
  - linux/arm64
modules:
  - from-file: layers/shared/core-base.yml
  - from-file: layers/shared/core.yml
  - from-file: layers/fedora/core.yml
  - from-file: layers/fedora/nvidia-open-arm.yml
  - from-file: layers/fedora/ceph-host.yml
  - type: initramfs
  - type: signing
