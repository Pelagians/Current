# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: alma9-gnome-nvidia-open-arm64
description: Current ARM64 AlmaLinux 9 GNOME workstation image with the NVIDIA open driver lane.
base-image: quay.io/almalinuxorg/almalinux-bootc
image-version: 9
platforms:
  - linux/arm64
modules:
  - from-file: layers/alma9/arm-core.yml
  - from-file: layers/shared/core-base.yml
  - from-file: layers/alma/core.yml
  - from-file: layers/shared/core.yml
  - from-file: layers/alma9/core.yml
  - from-file: layers/alma9/nvidia-open.yml
  - from-file: layers/shared/flatpak-base.yml
  - from-file: layers/shared/workstation-common.yml
  - from-file: layers/alma9/workstation.yml
  - from-file: layers/shared/workstation-gnome.yml
  - from-file: layers/alma9/gnome.yml
  - from-file: layers/shared/nvidia-workstation.yml
  - from-file: layers/alma9/nvidia-workstation.yml
  - type: initramfs
  - type: signing
