---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-cosmic-nvidia-580-arm64
description: Current ARM64 Fedora COSMIC workstation image with the nvidia-580 driver lane.
base-image: quay.io/fedora/fedora-bootc
image-version: latest
platforms:
  - linux/arm64
modules:
  - from-file: layers/shared/core-base.yml
  - from-file: layers/shared/core.yml
  - from-file: layers/fedora/core.yml
  - from-file: layers/shared/flatpak-base.yml
  - from-file: layers/shared/workstation-common.yml
  - from-file: layers/fedora/workstation.yml
  - from-file: layers/fedora/cosmic.yml
  - from-file: layers/shared/workstation-cosmic.yml
  - from-file: layers/fedora/nvidia-580.yml
  - from-file: layers/fedora/nvidia-580-workstation.yml
  - type: initramfs
  - type: signing
