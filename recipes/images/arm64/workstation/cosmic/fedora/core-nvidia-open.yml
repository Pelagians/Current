---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-cosmic-nvidia-open-arm64
description: NVIDIA open kernel modules; Current ARM64 Fedora edge COSMIC workstation image.
base-image: quay.io/fedora/fedora-bootc
image-version: latest
platforms:
  - linux/arm64
modules:
  - from-file: layers/shared/core-base.yml
  - from-file: layers/shared/core.yml
  - from-file: layers/fedora/core.yml
  - from-file: layers/fedora/nvidia-open-arm.yml
  - from-file: layers/shared/flatpak-base.yml
  - from-file: layers/shared/workstation-common.yml
  - from-file: layers/fedora/workstation.yml
  - from-file: layers/fedora/cosmic.yml
  - from-file: layers/shared/workstation-cosmic.yml
  - from-file: layers/fedora/nvidia-open-arm-workstation.yml
  - type: initramfs
  - type: signing
