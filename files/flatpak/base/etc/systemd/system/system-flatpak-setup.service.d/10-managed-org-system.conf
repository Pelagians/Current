[Service]
# BlueBuild default-flatpaks v2. Hold the maintenance lock over setup and restore
# visibility even if setup fails. ExecStopPost also recovers after SIGKILL.
ExecStart=
ExecStart=/usr/libexec/current-flatpak-system-maintenance setup
ExecStartPost=
ExecStopPost=/usr/libexec/current-flatpak-system-maintenance ensure
